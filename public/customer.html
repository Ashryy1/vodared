    ::-webkit-scrollbar {

      background: #8b5cf680;

    }

    @keyframes gradient-shift {

      0%,
      to {
        background-position: 0%
      }

      50% {
        background-position: 100%
      }
    }

    .animate-gradient {
      background-size: 200% 200%;
      animation: 8s infinite gradient-shift
    }

    @keyframes float-1 {

      0%,
      to {
        transform: translate(0)scale(1)
      }

      25% {
        transform: translate(80px, -60px)scale(1.1)
      }

      50% {
        transform: translate(-40px, 40px)scale(.95)
      }

      75% {
        transform: translate(60px, 80px)scale(1.05)
      }
    }

    @keyframes float-2 {

      0%,
      to {
        transform: translate(0)scale(1)
      }

      25% {
        transform: translate(-70px, 50px)scale(1.05)
      }

      50% {
        transform: translate(50px, -70px)scale(.9)
      }

      75% {
        transform: translate(-30px, -40px)scale(1.1)
      }
    }

    @keyframes float-3 {

      0%,
      to {
        transform: translate(0)rotate(0)scale(1)
      }

      33% {
        transform: translate(60px, 60px)rotate(120deg)scale(1.15)
      }

      66% {
        transform: translate(-50px, 30px)rotate(240deg)scale(.85)
      }
    }

    .animate-float-1 {
      animation: 20s ease-in-out infinite float-1
    }

    .animate-float-2 {
      animation: 25s ease-in-out infinite float-2
    }

    .animate-float-3 {
      animation: 18s ease-in-out infinite float-3
    }

    @keyframes pulse-ring {
      0% {
        opacity: 1;
        transform: scale(.8)
      }

      to {
        opacity: 0;
        transform: scale(2)
      }
    }

    .animate-pulse-ring {
      animation: 2s ease-out infinite pulse-ring
    }

    .input-glow:focus-within {
      box-shadow: 0 0 0 3px #8b5cf626, 0 0 20px #8b5cf61a
    }

    @keyframes shimmer {
      0% {
        transform: translate(-100%)rotate(25deg)
      }

      to {
        transform: translate(200%)rotate(25deg)
      }
    }

    .shimmer-effect:before {
      content: "";
      pointer-events: none;
      background: linear-gradient(135deg, #0000 30%, #ffffff0d, #0000 70%);
      animation: 4s ease-in-out infinite shimmer;
      position: absolute;
      inset: 0
    }

    @keyframes spin-slow {
      0% {
        transform: rotate(0)
      }

      to {
        transform: rotate(360deg)
      }
    }

    .animate-spin-slow {
      animation: .8s linear infinite spin-slow
    }

    @keyframes checkmark {
      0% {
        stroke-dashoffset: 100px
      }

      to {
        stroke-dashoffset: 0
      }
    }

    @keyframes success-pop {
      0% {
        opacity: 0;
        transform: scale(.5)
      }

      50% {
        transform: scale(1.1)
      }

      to {
        opacity: 1;
        transform: scale(1)
      }
    }

    .animate-success-pop {
      animation: .5s cubic-bezier(.34, 1.56, .64, 1) forwards success-pop
    }
